[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "been-job-bot"
version = "0.1.0"
description = "Persistent early-career job discovery and Discord notifications"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
jobbot = "jobbot.cli:main"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: Discover job boards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Share the scan workflow's lock: both update the same SQLite file.
concurrency:
  group: jobbot-database
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PATH: state/jobs.sqlite3
      COMPANY_REGISTRY: config/companies.json
      DISCOVERY_SOURCES: config/discovery.json
      DEBUG: "true"
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      SWE_INTERNS: ${{ secrets.SWE_INTERNS }}
      SWE_NG: ${{ secrets.SWE_NG }}
      QUANT_INTERNS: ${{ secrets.QUANT_INTERNS }}
      QUANT_NG: ${{ secrets.QUANT_NG }}
      AI_INTERNS: ${{ secrets.AI_INTERNS }}
      AI_NG: ${{ secrets.AI_NG }}
      POSTING_CHANNEL: ${{ secrets.POSTING_CHANNEL }}
      TEST_CHANNEL: ${{ secrets.TEST_CHANNEL }}
      ROLE_ID_LOVES_NOTIFICATIONS: ${{ secrets.ROLE_ID_LOVES_NOTIFICATIONS }}
      ROLE_ID_JOB_PING: ${{ secrets.ROLE_ID_JOB_PING }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps .
      - name: Install Drive client
        run: sudo apt-get install --yes rclone
      - name: Restore database state
        env:
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_GDRIVE" || {
            echo "RCLONE_CONFIG_GDRIVE is required; see README.md."
            exit 1
          }
          umask 077
          config_file="$RUNNER_TEMP/rclone.conf"
          printf '%s' "$RCLONE_CONFIG_GDRIVE" > "$config_file"
          export RCLONE_CONFIG="$config_file"
          mkdir -p state
          if [ -f state/current.json ]; then
            remote_path="$(python -m jobbot.drive_state current-path state/current.json)"
            rclone copyto "gdrive:$remote_path" "$DATABASE_PATH" --checksum
            python -m jobbot.drive_state verify state/current.json "$DATABASE_PATH"
          else
            echo "No manifest yet; initializing a new database."
          fi
      - run: jobbot check-config
      - run: jobbot discover
      - run: jobbot scan
      - name: Publish database state
        env:
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          set -euo pipefail
          umask 077
          config_file="$RUNNER_TEMP/rclone.conf"
          printf '%s' "$RCLONE_CONFIG_GDRIVE" > "$config_file"
          export RCLONE_CONFIG="$config_file"
          next_manifest="$RUNNER_TEMP/current.json"
          python -m jobbot.drive_state next-manifest state/current.json "$DATABASE_PATH" > "$next_manifest"
          remote_path="$(python -m jobbot.drive_state current-path "$next_manifest")"
          rclone copyto "$DATABASE_PATH" "gdrive:$remote_path" --checksum
          python -m jobbot.drive_state verify "$next_manifest" "$DATABASE_PATH"
          mv "$next_manifest" state/current.json
          git add state/current.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: persist discovered job boards"
            git push
          fi
          python -m jobbot.drive_state retained-paths state/current.json > "$RUNNER_TEMP/retained-paths"
          while IFS= read -r remote_path; do
            case "$remote_path" in
              jobs-*.sqlite3)
                if ! grep --fixed-strings --line-regexp --quiet "$remote_path" "$RUNNER_TEMP/retained-paths"; then
                  rclone deletefile "gdrive:$remote_path" --drive-use-trash=false
                fi
                ;;
            esac
          done < <(rclone lsf gdrive: --files-only)

name: Job bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# The database is committed after each successful scan, so this workflow needs
# permission to update its own branch.
permissions:
  contents: write

# A SQLite file cannot be merged. Serialize manual and scheduled invocations.
concurrency:
  group: jobbot-database
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PATH: state/jobs.sqlite3
      COMPANY_REGISTRY: config/companies.json
      DISCOVERY_SOURCES: config/discovery.json
      DEBUG: "true"
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      SWE_INTERNS: ${{ secrets.SWE_INTERNS }}
      SWE_NG: ${{ secrets.SWE_NG }}
      QUANT_INTERNS: ${{ secrets.QUANT_INTERNS }}
      QUANT_NG: ${{ secrets.QUANT_NG }}
      AI_INTERNS: ${{ secrets.AI_INTERNS }}
      AI_NG: ${{ secrets.AI_NG }}
      POSTING_CHANNEL: ${{ secrets.POSTING_CHANNEL }}
      TEST_CHANNEL: ${{ secrets.TEST_CHANNEL }}
      ROLE_ID_LOVES_NOTIFICATIONS: ${{ secrets.ROLE_ID_LOVES_NOTIFICATIONS }}
      ROLE_ID_JOB_PING: ${{ secrets.ROLE_ID_JOB_PING }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps .
      - run: jobbot check-config
      - run: jobbot scan
      - name: Commit database state
        run: |
          git add state/jobs.sqlite3
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: persist job bot state"
          git push
